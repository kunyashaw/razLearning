server {
    listen 80;
    server_name localhost;
    
    # 网站根目录
    root /www/wwwroot/raz-app;
    index index.html;
    
    # 日志配置
    access_log /var/log/nginx/raz-app.access.log;
    error_log /var/log/nginx/raz-app.error.log;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    
    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }
    
    # myBooks目录（绘本资源）
    location /myBooks/ {
        alias /www/wwwroot/raz-app/myBooks/;
        try_files $uri $uri/ =404;
        
        # 允许跨域访问（如果需要）
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        
        # 大文件支持
        client_max_body_size 100M;
        
        # 视频文件支持
        location ~* \.(mp4|webm|ogg)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
        
        # PDF文件支持
        location ~* \.pdf$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
        
        # 音频文件支持
        location ~* \.(mp3|wav|ogg)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # 前端路由支持（Vue Router history模式）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    
    # 安全 headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~* ^/(README|CHANGELOG|LICENSE|composer\.json|package\.json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

